<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Jerimy Brown</title>

    <!-- Meta Tags -->
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="Jerimy Brown">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://jerimybrown.com/blog/{{SLUG}}.html">
    <meta property="og:title" content="{{TITLE}} - Jerimy Brown">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://jerimybrown.com/blog/{{SLUG}}.html">
    <meta name="twitter:title" content="{{TITLE}} - Jerimy Brown">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">

    <!-- Canonical -->
    <link rel="canonical" href="https://jerimybrown.com/blog/{{SLUG}}.html">

    <!-- Structured Data -->
    <script type="application/ld+json">{{JSON_LD}}</script>

    <!-- Favicon -->
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <!-- Google Fonts: IBM Plex Sans -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../assets/css/main.css?v={{CACHE_VERSION}}">

    <style>
        /* Critical inline styles to prevent navigation flash */
        .nav {
            background: rgba(250, 250, 250, 0.1) !important;
        }
    </style>

    <noscript>
        <style>
            body { opacity: 1 !important; }
        </style>
    </noscript>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <div class="logo-container">
                    <div class="logo-svg"></div>
                    <span class="logo-text">Jerimy Brown</span>
                </div>
            </a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="../index.html"><span class="link-text">Home</span></a></li>
                    <li><a href="../index.html#projects"><span class="link-text">Work</span></a></li>
                    <li><a href="../index.html#about"><span class="link-text">About</span></a></li>
                    <li><a href="../index.html#contact"><span class="link-text">Contact</span></a></li>
                    <li><a href="../blog.html" class="active"><span class="link-text">Blog</span></a></li>
                    <li><a href="../lab.html"><span class="link-text">Lab</span></a></li>
                    <li><a href="../resume.html"><span class="link-text">Resume</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Toggle Button -->
    <button class="nav-mobile-toggle" onclick="toggleMobileMenu()" aria-label="Toggle mobile menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
    </button>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay">
        <div class="mobile-menu-content">
            <nav class="mobile-nav">
                <a href="../index.html" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">Home</span></a>
                <a href="../index.html#projects" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">Work</span></a>
                <a href="../index.html#about" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">About</span></a>
                <a href="../index.html#contact" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">Contact</span></a>
                <a href="../blog.html" onclick="toggleMobileMenu(event)" class="active"><span class="mobile-link-text">Blog</span></a>
                <a href="../lab.html" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">Lab</span></a>
                <a href="../resume.html" onclick="toggleMobileMenu(event)"><span class="mobile-link-text">Resume</span></a>
            </nav>
        </div>
    </div>

    <!-- Blog Post Content -->
    <main class="blog-detail">
        <article class="blog-article" data-post-slug="{{SLUG}}">
            <div class="container">
                <!-- Back link -->
                <a href="../blog.html" class="blog-back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back to Blog
                </a>

                <!-- Article Header -->
                <header class="blog-article__header" id="blog-header">
                    <!-- Title, category, date rendered by JavaScript -->
                </header>

                <!-- Two-column layout: content left, carousel right -->
                <div class="blog-article__layout">
                    <div class="blog-article__content-column">
                        <!-- Article Body (inlined at build time) -->
                        <div class="blog-article__body">
                            {{CONTENT}}
                        </div>

                        <!-- Interactive CTA (rendered by build if interactiveUrl exists) -->
                        {{INTERACTIVE_CTA}}

                        <!-- Related Item (populated by JavaScript if relatedItem exists) -->
                        <div class="blog-article__related" id="blog-related"></div>
                    </div>

                    <!-- Carousel column (hidden if no images, shown by JS) -->
                    <div class="blog-article__images">
                        <div id="blog-carousel">
                            <!-- Carousel rendered by JavaScript if images exist -->
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <!-- Back to Blog Button -->
    <a href="../blog.html" class="btn-arrow btn-arrow-md back-to-projects">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 12L6 12M10 8L6 12L10 16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <!-- Back to Top Button -->
    <button class="btn-arrow btn-arrow-md btn-arrow-filled back-to-top" onclick="scrollToTop()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 18L12 6M8 10L12 6L16 10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Scripts -->
    <script src="../assets/js/core/config.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/core/data-loader.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/core/theme-system.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/utils/helpers.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/utils/animations.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/components/navigation.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/components/mobile-menu.js?v={{CACHE_VERSION}}"></script>
    <script src="../assets/js/components/logo-animation.js?v={{CACHE_VERSION}}"></script>

    <!-- Blog Detail Module -->
    <script type="module" src="../assets/js/blog/blog-detail.js?v={{CACHE_VERSION}}"></script>
{{POST_SCRIPTS}}

    <!-- Page initialization (blog-specific, no content renderers needed) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initTheme === 'function') initTheme();
            if (typeof initLogoLetterAnimation === 'function') initLogoLetterAnimation();
            if (typeof initBackToTop === 'function') initBackToTop();
            if (typeof initPageTransitions === 'function') initPageTransitions();
            if (typeof initNavigationActiveState === 'function') initNavigationActiveState();
            if (typeof initMobileMenuClose === 'function') initMobileMenuClose();
        });
    </script>
</body>
</html>
